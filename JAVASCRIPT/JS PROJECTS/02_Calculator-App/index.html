<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <input type="text" readonly id="input-box">
        <div class="keys">
            <button onclick="appentToDigits('+')" class="operator">+</button>
            <button onclick="appentToDigits('9')">9</button>
            <button onclick="appentToDigits('8')">8</button>
            <button onclick="appentToDigits('7')">7</button>
            <button onclick="appentToDigits('-')" class="operator">-</button>
            <button onclick="appentToDigits('6')">6</button>
            <button onclick="appentToDigits('5')">5</button>
            <button onclick="appentToDigits('4')">4</button>
            <button onclick="appentToDigits('*')" class="operator">*</button>
            <button onclick="appentToDigits('3')">3</button>
            <button onclick="appentToDigits('2')">2</button>
            <button onclick="appentToDigits('1')">1</button>
            <button onclick="appentToDigits('/')" class="operator">/</button>
            <button onclick="appentToDigits('0')">0</button>
            <button onclick="appentToDigits('.')">.</button>
            <button onclick="clearDisplay('C')" class="clear">C</button>
            <button onclick="calculate('=')" class="calculate">=</button>
           
        </div>
    </div>
</body>
</html>
