<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">

        <input type="text" name="" id="inputBox" placeholder="Enter City Name" spellcheck="false">
        <button class="search"><i class="fa-solid fa-magnifying-glass"></i></button>

        <div class="weather">
            <h2 class="display-temperature"></h2>
            <h2 class="display-city"></h2>

            <div class="clear-img" id="img">
                <img src="images/clear.png" alt="" width="80px" height="70px">
            </div>
          
            <div class="weather-con">
                <div class="weather-change">
                    <img src="images/humidity.png" alt="">
                    <div class="div">
                        <h2 class="displayHumidity"></h2>
                        <h2>Humidity</h2>
                    </div>
                  
                </div>
                <div class="weather-change">
                    <img src="images/wind.png" alt="">
                  <div class="div">
                    <h2 class="displayWindSpeed"></h2>
                    <h2>Wind speed</h2>
                  </div>
                </div>
            </div>
        </div>

    
    
    </div>
</body>

</html>
